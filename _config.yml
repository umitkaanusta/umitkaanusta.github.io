plugins:
  - jekyll-relative-links
  - jekyll-katex
  - jekyll-rouge
relative_links:
  enabled: true
  collections: true
include:
  - README.md
highlighter: rouge
markdown: kramdown
kramdown:
  math_engine: katex
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
use_math: true
